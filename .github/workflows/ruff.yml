name: Ruff

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Lint
        uses: astral-sh/ruff-action@v4.1.0

      - name: Check formatting
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: format --check --diff
